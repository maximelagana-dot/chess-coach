name: Compiler l'APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -o chesscoach_tous_echiquiers.zip -d projet

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ajouter Stockfish (Android arm64)
        run: |
          curl -sSL -o sf.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-android-armv8.tar
          mkdir sf && tar -xf sf.tar -C sf
          BIN=$(find sf -type f -name 'stockfish-android-armv8*' | head -1)
          echo "Binaire trouvé : $BIN"
          mkdir -p projet/app/src/main/jniLibs/arm64-v8a
          cp "$BIN" projet/app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Compiler
        working-directory: projet
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chesscoach-apk
          path: projet/app/build/outputs/apk/debug/app-debug.apk
