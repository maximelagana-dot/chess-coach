name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le projet
        run: |
          mkdir -p work
          unzip -q -o projet.zip -d work

      - name: Compiler Stockfish
        working-directory: work
        run: bash build-stockfish.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Construire l'APK
        working-directory: work
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chess Coach Auto ${{ github.run_number }}
          files: work/app/build/outputs/apk/release/app-release.apk
