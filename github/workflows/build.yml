name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le projet
        run: |
          mkdir -p work
          unzip -q projet.zip -d work

      - name: Compiler Stockfish pour Android (arm64)
        run: |
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git sf
          cd sf/src
          make -j4 build ARCH=armv8 COMP=ndk
          mkdir -p "$GITHUB_WORKSPACE/work/app/src/main/jniLibs/arm64-v8a"
          cp stockfish "$GITHUB_WORKSPACE/work/app/src/main/jniLibs/arm64-v8a/libstockfish.so"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Construire l'APK
        working-directory: work
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chess Coach Auto ${{ github.run_number }}
          files: work/app/build/outputs/apk/debug/app-debug.apk
